name: Admin tests and build

on:
  pull_request:
    paths:
      - "admin/**"
      - ".github/workflows/admin-checks.yml"

permissions:
  contents: read

jobs:
  admin:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: admin

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # admin/ does not currently have a package-lock.json.
      - name: Install admin dependencies
        run: npm install --no-audit --no-fund
      - name: Run admin tests
        run: npm test
      - name: Build admin for reverse-proxy JWT header
        env:
          VITE_API_BASE_URL: https://admin.idobata.example.test
          VITE_JWT_AUTH_HEADER: X-Idobata-JWT
        run: npm run build

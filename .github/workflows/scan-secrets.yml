name: Secrets scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Gitleaks worktree
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source and complete reachable history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Reject re-import of the credential-bearing history
        shell: bash
        run: |
          set -euo pipefail
          if test -n "$(git log --all --format=%H -- idea-discussion/backend/app.yaml)"; then
            echo "::error::Forbidden historical app.yaml detected. Never merge upstream Git history."
            exit 1
          fi
      - name: Run source sync safety tests
        run: python3 .github/scripts/test_sync_ota_source.py
      - name: Ensure no unresolved Ota sync conflicts
        run: |
          if test -f .github/OTA_SYNC_PENDING.md; then
            echo "::error::Unresolved Ota sync collisions: review .github/OTA_SYNC_PENDING.md"
            exit 1
          fi
      - name: Scan files for credentials
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none \
            --volume "$PWD:/src:ro" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            dir /src --no-banner --redact --exit-code 1
